<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="page">
        <div id="register-container" class="card">
            <h1 class="title">Register</h1>
            <p class="subtitle">Create your account to get started.</p>

            <form id="register-form" novalidate>
                <div class="field">
                    <label class="label-id" for="username">Username</label>
                    <input class="input-class" type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="field">
                    <label class="label-id" for="email">Email</label>
                    <input class="input-class" type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="field">
                    <label class="label-id" for="password">Password</label>
                    <input class="input-class" type="password" id="password" name="password" required autocomplete="new-password">
                </div>

                <div class="register-button-parent">
                    <button type="submit" class="register-button" id="register">Register</button>
                </div>
            </form>

            <div class="register-button-parent">
                <button type="button" class="register-button secondary" onclick="changeColor()">Change Color</button>
            </div>

            <p id="message" class="message" role="status" aria-live="polite"></p>
        </div>
    </div>

    <script src="register.js"></script>
</body>

</html>
